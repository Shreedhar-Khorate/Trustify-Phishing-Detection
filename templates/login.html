<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
	<style>
	* {
	box-sizing: border-box;
	font-family: 'Inter', 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ===== PAGE BACKGROUND ===== */
body {
	background:
		radial-gradient(600px 300px at 10% 10%, rgba(56,189,248,0.18), transparent 40%),
		radial-gradient(600px 300px at 90% 90%, rgba(34,197,94,0.15), transparent 40%),
		linear-gradient(180deg, #071029, #00121a);
	display: flex;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	height: 100vh;
	margin: 0;
	color: #e6eef6;
}

/* ===== TEXT ===== */
h1 {
	font-weight: 700;
	margin: 0;
	color: #e6f7ff;
}

h2 {
	text-align: center;
}

p {
	font-size: 14px;
	line-height: 20px;
	letter-spacing: 0.4px;
	margin: 16px 0 24px;
	color: #9aa9b8;
}

span {
	font-size: 12px;
	color: #9aa9b8;
}

a {
	color: #38bdf8;
	text-decoration: none;
}

/* ===== INPUTS ===== */
input {
	background: rgba(255,255,255,0.05);
	border: 1px solid rgba(255,255,255,0.12);
	padding: 12px 15px;
	margin: 8px 0;
	width: 100%;
	border-radius: 10px;
	color: #e6eef6;
	transition: border 0.2s ease, box-shadow 0.2s ease;
}

input::placeholder {
	color: rgba(230,238,246,0.45);
}

input:focus {
	outline: none;
	border-color: #38bdf8;
	box-shadow: 0 0 0 2px rgba(56,189,248,0.2);
}

/* ===== BUTTONS ===== */
button {
	border-radius: 999px;
	border: none;
	background: linear-gradient(90deg, #38bdf8, #22c55e);
	color: #02101a;
	font-size: 12px;
	font-weight: 700;
	padding: 12px 45px;
	letter-spacing: 1px;
	text-transform: uppercase;
	cursor: pointer;
	transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
	transform: translateY(-3px);
	box-shadow: 0 12px 35px rgba(56,189,248,0.35);
}

button:active {
	transform: scale(0.96);
}

button.ghost {
	background: transparent;
	border: 1px solid rgba(255,255,255,0.35);
	color: #ffffff;
}

/* ===== FORM ===== */
form {
	background: linear-gradient(180deg, rgba(6,10,20,0.92), rgba(6,8,14,0.92));
	display: flex;
	align-items: center;
	justify-content: center;
	flex-direction: column;
	padding: 0 50px;
	height: 100%;
	text-align: center;
}

/* ===== MAIN CARD ===== */
.container {
	background: rgba(2,6,23,0.9);
	border-radius: 16px;
	box-shadow: 0 30px 80px rgba(0,0,0,0.65);
	position: relative;
	overflow: hidden;
	width: 820px;
	max-width: 100%;
	min-height: 480px;
	border: 1px solid rgba(255,255,255,0.05);
}

/* ===== PANEL LOGIC (UNCHANGED) ===== */
.form-container {
	position: absolute;
	top: 0;
	height: 100%;
	transition: all 0.6s ease-in-out;
}

.sign-in-container {
	left: 0;
	width: 50%;
	z-index: 2;
}

.container.right-panel-active .sign-in-container {
	transform: translateX(100%);
}

.sign-up-container {
	left: 0;
	width: 50%;
	opacity: 0;
	z-index: 1;
}

.container.right-panel-active .sign-up-container {
	transform: translateX(100%);
	opacity: 1;
	z-index: 5;
	animation: show 0.6s;
}

@keyframes show {
	0%, 49.99% {
		opacity: 0;
		z-index: 1;
	}
	50%, 100% {
		opacity: 1;
		z-index: 5;
	}
}

/* ===== OVERLAY ===== */
.overlay-container {
	position: absolute;
	top: 0;
	left: 50%;
	width: 50%;
	height: 100%;
	overflow: hidden;
	transition: transform 0.6s ease-in-out;
	z-index: 100;
}

.container.right-panel-active .overlay-container {
	transform: translateX(-100%);
}

.overlay {
	background: linear-gradient(
		135deg,
		rgba(56,189,248,0.35),
		rgba(34,197,94,0.35)
	);
	background-repeat: no-repeat;
	background-size: cover;
	color: #ffffff;
	position: relative;
	left: -100%;
	height: 100%;
	width: 200%;
	transform: translateX(0);
	transition: transform 0.6s ease-in-out;
}

.container.right-panel-active .overlay {
	transform: translateX(50%);
}

.overlay-panel {
	position: absolute;
	display: flex;
	align-items: center;
	justify-content: center;
	flex-direction: column;
	padding: 0 40px;
	text-align: center;
	top: 0;
	height: 100%;
	width: 50%;
}

.overlay-left {
	transform: translateX(-20%);
}

.container.right-panel-active .overlay-left {
	transform: translateX(0);
}

.overlay-right {
	right: 0;
	transform: translateX(0);
}

.container.right-panel-active .overlay-right {
	transform: translateX(20%);
}

/* ===== SOCIAL ICONS ===== */
.social-container {
	margin: 20px 0;
}

.social-container a {
	border: 1px solid rgba(255,255,255,0.25);
	border-radius: 50%;
	display: inline-flex;
	justify-content: center;
	align-items: center;
	margin: 0 5px;
	height: 40px;
	width: 40px;
	color: #e6eef6;
	transition: background 0.2s ease, transform 0.2s ease;
}

.social-container a:hover {
	background: rgba(255,255,255,0.1);
	transform: translateY(-3px);
}
/* Back to Trustify */
/* ===============================
   Back to Trustify – Enhanced UI
   =============================== */

/* target the back link without changing HTML */
a[href="index.html"] {
	position: absolute;
	top: 22px;
	left: 22px;

	display: inline-flex;
	align-items: center;
	gap: 8px;

	padding: 10px 16px;
	border-radius: 999px;

	font-size: 14px;
	font-weight: 600;
	letter-spacing: 0.3px;

	color: #38bdf8;
	background: rgba(255, 255, 255, 0.04);
	border: 1px solid rgba(56, 189, 248, 0.35);

	backdrop-filter: blur(6px);
	-webkit-backdrop-filter: blur(6px);

	box-shadow:
		0 10px 30px rgba(2, 6, 23, 0.6),
		inset 0 0 0 rgba(56,189,248,0);

	transition:
		transform 0.25s ease,
		box-shadow 0.25s ease,
		background 0.25s ease,
		color 0.25s ease;
}

/* subtle arrow animation on hover */
a[href="index.html"]::before {
	content: "←";
	font-size: 16px;
	transition: transform 0.25s ease;
}

/* hover effect */
a[href="index.html"]:hover {
	color: #e6f7ff;
	background: linear-gradient(
		90deg,
		rgba(56,189,248,0.18),
		rgba(34,197,94,0.12)
	);
	transform: translateY(-3px);

	box-shadow:
		0 20px 50px rgba(56,189,248,0.25),
		0 6px 20px rgba(2,6,23,0.6);
}

/* arrow slide on hover */
a[href="index.html"]:hover::before {
	transform: translateX(-4px);
}

/* active click */
a[href="index.html"]:active {
	transform: scale(0.96);
}

	</style>
</head>
<body>
<div class="container" id="container">
    <div class="form-container sign-up-container">
        <form>
            <h1>Create Account</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="google"></i></a>
                <a href="#" class="social"><i class="linkedin"></i></a>
            </div>
            <span>or use your email for registration</span>
            <input type="text" name="fname" placeholder="First name">
            <input type="text" name="lname" placeholder="Last name">
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">SIGN UP</button>
        </form>
    </div>
    <div class=" form-container sign-in-container">
        <form>
            <h1>Sign In</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="google"></i></a>
                <a href="#" class="social"><i class="linkedin"></i></a>
            </div>
            <span>or use your account</span>
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">SIGN IN</button>
        </form>
    </div>
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal information</p>
                <button class="ghost" id="signIn">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Dear Customer!</h1>
                <p>Enter your details and start your journey with us</p>
                <button class="ghost" id="signUp">Sign Up</button>
            </div>
        </div>
    </div>
</div>
<a href="index.html">
Back to Trustify
</a>

<script>
	const signUpButton = document.getElementById('signUp');
	const signInButton = document.getElementById('signIn');
	const container = document.getElementById('container');

	signUpButton.addEventListener('click', () => {
		container.classList.add("right-panel-active");
	});
	signInButton.addEventListener('click', () => {
		container.classList.remove("right-panel-active");
	});

	// ✅ CONNECT LOGIN → MAIN INDEX
	document.querySelectorAll("form").forEach(form => {
		form.addEventListener("submit", (e) => {
			e.preventDefault(); // stop real submit
			window.location.href = "index.html"; // redirect to main page
		});
	});
</script>


</body>
</html>
